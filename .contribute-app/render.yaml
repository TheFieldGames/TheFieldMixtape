# Render Blueprint. dockerfilePath/dockerContext are repo-root-relative
# paths already (confirmed live: rootDir gets PREPENDED to them, not
# replaced by them — setting both rootDir and a .contribute-app/-prefixed
# path double-nested into .contribute-app/.contribute-app and broke checkout).
# So no rootDir here; dockerfilePath/dockerContext alone are sufficient.
services:
  - type: web
    name: thefieldmixtape
    runtime: docker
    plan: free
    dockerfilePath: .contribute-app/Dockerfile
    dockerContext: .contribute-app
    # Without this, Auto-Deploy (which watches all of `main`) redeploys the
    # service on EVERY real submission, since processSubmission() itself
    # pushes a commit (THUNDERSTORE.md) to main — killing the in-flight container
    # mid tcli-build/tcli-publish. Confirmed via Render's Events log: a
    # submission's own "Add track: ..." commit triggered "Deploy started"
    # seconds after the push, which tore down the container that was still
    # running that same submission (a real incident, 2026-08-21, the first
    # real submission on this deploy). Scoping the trigger to this directory
    # means only actual app-code changes redeploy the service.
    buildFilter:
      paths:
        - ".contribute-app/**"
    envVars:
      - key: PORT
        value: 3000
      - key: APP_PASSWORD_HASH
        sync: false
      # Optional second password (see .env.example) — unlocks Dry Run.
      # Not required to boot; leave unset in the dashboard to disable it.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_PAT
        sync: false
      - key: GIT_REPO_URL
        value: https://github.com/TheFieldGames/TheFieldMixtape.git
      - key: GIT_TARGET_BRANCH
        value: main
      - key: TCLI_AUTH_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: thefieldmixtape-audio
