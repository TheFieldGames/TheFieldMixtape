name: Sync Tracklist

on:
  pull_request:
    branches:
      - main
    paths:
      - "my mixtape/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Regenerate tracklist in THUNDERSTORE.md
        run: |
          python3 - <<'PY'
          import os
          import re

          folder = "my mixtape"
          files = sorted(
              (f[:-4] for f in os.listdir(folder) if f.endswith(".ogg")),
              key=str.casefold,
          )
          tracklist = "\n".join(f"{i}. {name}" for i, name in enumerate(files, 1))

          with open("THUNDERSTORE.md", "r") as f:
              readme = f.read()

          new_block = f"<!-- TRACKLIST:START -->\n{tracklist}\n<!-- TRACKLIST:END -->"
          readme = re.sub(
              r"<!-- TRACKLIST:START -->.*?<!-- TRACKLIST:END -->",
              new_block,
              readme,
              flags=re.DOTALL,
          )

          with open("THUNDERSTORE.md", "w") as f:
              f.write(readme)
          PY

      - name: Check whether tracklist changed
        id: check
        run: |
          if git diff --quiet -- THUNDERSTORE.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lock PR while tracklist is out of sync
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready ${{ github.event.pull_request.number }} --undo

      - name: Commit tracklist update
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add THUNDERSTORE.md
          git commit -m "Auto-update tracklist"
          git push origin HEAD:${{ github.head_ref }}

      - name: Unlock PR now that tracklist is synced
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready ${{ github.event.pull_request.number }}
