name: Upload Thunderstore Package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          TAG_PREFIX: v

      - name: Upload Thunderstore Package
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          namespace: TheField
          community: peak
          repo: https://thunderstore.io
          token: ${{ secrets.TCLI_AUTH_TOKEN }}
          name: TheFieldMixtape
          description: The Field's Mixtape
          version: ${{ steps.tag.outputs.new_tag }}
          deps: onlystar-sPEAKer@2.3.6
          categories: |
            mixtapes
